name: CI - Distributed Honeypot Benchmark Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run automated test suite (pytest)
        run: |
          pytest tests/ -v

      - name: Validate all 10 experiment runners
        run: |
          python experiments/E01_functional/runner.py
          python experiments/E02_authentication/runner.py
          python experiments/E03_session_capture/runner.py
          python experiments/E04_cross_service/runner.py
          python experiments/E05_cross_node/runner.py
          python experiments/E06_interleaved_attackers/runner.py
          python experiments/E07_clock_perturbation/runner.py
          python experiments/E08_node_failure/runner.py
          python experiments/E09_collector_failure/runner.py
          python experiments/E10_scalability/runner.py
