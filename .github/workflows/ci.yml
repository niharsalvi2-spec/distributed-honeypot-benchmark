name: CI - Distributed Honeypot Benchmark Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run automated test suite (pytest)
        run: |
          mkdir -p reports
          pytest tests/ -v --junitxml=reports/junit.xml

      - name: Generate Machine-Readable CI Verification Report
        if: always()
        run: |
          python scripts/ci/generate_ci_report.py

      - name: Validate all 10 experiment runners
        run: |
          python experiments/E01_functional/runner.py
          python experiments/E02_authentication/runner.py
          python experiments/E03_session_capture/runner.py
          python experiments/E04_cross_service/runner.py
          python experiments/E05_cross_node/runner.py
          python experiments/E06_interleaved_attackers/runner.py
          python experiments/E07_clock_perturbation/runner.py
          python experiments/E08_node_failure/runner.py
          python experiments/E09_collector_failure/runner.py
          python experiments/E10_scalability/runner.py

      - name: Run Algorithmic Feature Ablation Benchmark
        run: |
          python -m analysis.feature_ablation.ablation_runner

      - name: Run Empirical Negative Controls Benchmark
        run: |
          python -m analysis.negative_controls.benchmark_negative_controls

      - name: Upload Verification & Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ci-validation-artifacts
          path: |
            reports/
            results/
