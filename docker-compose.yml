version: '3.8'

networks:
  benchmark-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  collector:
    build:
      context: .
      dockerfile: infrastructure/docker/collector/Dockerfile
    container_name: benchmark_collector
    ports:
      - "8000:8000"
    networks:
      benchmark-net:
        ipv4_address: 172.28.0.10
    environment:
      - COLLECTOR_PORT=8000
      - LOG_LEVEL=DEBUG
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs

  node-ssh:
    build:
      context: .
      dockerfile: infrastructure/docker/cowrie/Dockerfile
    container_name: benchmark_node_ssh
    ports:
      - "2222:2222"
    networks:
      benchmark-net:
        ipv4_address: 172.28.0.21
    environment:
      - NODE_ID=node_ssh_01
      - COLLECTOR_URL=http://172.28.0.10:8000/events

  node-opencanary:
    build:
      context: .
      dockerfile: infrastructure/docker/opencanary/Dockerfile
    container_name: benchmark_node_canary
    ports:
      - "2121:21"
      - "8080:80"
    networks:
      benchmark-net:
        ipv4_address: 172.28.0.22
    environment:
      - NODE_ID=node_canary_02
      - COLLECTOR_URL=http://172.28.0.10:8000/events
