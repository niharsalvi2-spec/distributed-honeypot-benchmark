[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-honeypot-benchmark"
version = "1.0.0"
description = "Empirical benchmarking framework for distributed honeypots, event ordering, and cross-service correlation."
authors = [{ name = "Team Gamergenix", email = "research@pccoe.edu.in" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "requests>=2.31.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0"
]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
